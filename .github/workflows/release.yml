name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MinGW Toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils

      - name: Run Unit & Offscreen Render Tests
        shell: msys2 {0}
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/run_tests.ps1 -Render

      - name: Build rapoo-tray.exe (Standalone)
        shell: msys2 {0}
        run: |
          mkdir -p bin
          windres --codepage 65001 -I res -i res/app.rc -o bin/app.o
          g++ -std=c++17 -O3 -mwindows -municode -s -static src/main.cpp src/rapoo_protocol.cpp src/device_manager.cpp src/osd_window.cpp src/tray_menu.cpp src/alert_window.cpp src/alert_settings.cpp src/hid_transport.cpp src/keyboard_manager.cpp src/autostart.cpp bin/app.o -lsetupapi -lhid -luser32 -lgdi32 -lshell32 -ladvapi32 -luxtheme -ldwmapi -o bin/rapoo-tray.exe
          rm -f bin/app.o

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            bin/rapoo-tray.exe
